<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机B站视频 · 极简播放器</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0f0f0f;
            color: #e0e0e0;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            padding: 16px;
        }
        .player-wrapper {
            width: 100%;
            max-width: 960px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 6px 24px rgba(0,0,0,0.7);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
        .info {
            margin-top: 20px;
            text-align: center;
            max-width: 960px;
            width: 100%;
        }
        .info a {
            color: #00a1d6;
            text-decoration: none;
            font-size: 1.15rem;
            font-weight: 600;
            word-break: break-word;
            line-height: 1.4;
        }
        .info a:hover { text-decoration: underline; }
        .btn {
            margin-top: 18px;
            padding: 10px 28px;
            background: #00a1d6;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background .2s, transform .1s;
        }
        .btn:hover { background: #0088b3; }
        .btn:active { transform: scale(0.97); }
        .note {
            margin-top: 14px;
            font-size: 0.82rem;
            color: #777;
            text-align: center;
            max-width: 600px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="player-wrapper">
        <!-- allow="autoplay" 让静音自动播放生效 -->
        <iframe id="bilibili-player" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>
    <div class="info">
        <a id="video-link" href="#" target="_blank" rel="noopener">正在加载视频…</a>
    </div>
    <button class="btn" id="next-btn">换一个视频</button>
    <p class="note">
        视频默认静音自动播放，取消静音请点击播放器内的音量按钮。<br>
        刷新页面也会随机换一个视频。
    </p>

    <script>
        /* ========== 视频列表 ==========
           把 bvid 和 title 换成你想要的视频即可。
           bvid 就是 B 站视频链接里 BV 开头的那一串，例如：
           https://www.bilibili.com/video/BV1G3411M7BN 中的 BV1G3411M7BN
        */
        const videos = [
            { bvid: 'BV1G3411M7BN', title: '示例视频一' },
            { bvid: 'BV1bvMHz7EVJ', title: '示例视频二' },
            { bvid: 'BV1UX4y1T7dT', title: '示例视频三' },
            // 可以按同样格式继续添加…
        ];

        function getRandomVideo() {
            return videos[Math.floor(Math.random() * videos.length)];
        }

        function loadVideo() {
            if (videos.length === 0) return;

            const video = getRandomVideo();

            // 构建 B 站官方外链播放器参数
            // hideCoverInfo=1  隐藏播放量/弹幕量等信息
            // danmaku=0       关闭弹幕
            // hideDanmakuButton=1 隐藏弹幕按钮
            // noFullScreenButton=1 隐藏全屏按钮（可选）
            // muted=1 + autoplay=1  静音自动播放，符合浏览器自动播放策略
            const params = new URLSearchParams({
                bvid: video.bvid,
                autoplay: 1,
                muted: 1,
                danmaku: 0,
                hideCoverInfo: 1,
                hideDanmakuButton: 1,
                noFullScreenButton: 1,
                high_quality: 1   // 尝试请求高画质（部分视频/环境可能不生效）
            });

            const iframe = document.getElementById('bilibili-player');
            iframe.src = `https://player.bilibili.com/player.html?${params.toString()}`;

            // 用视频标题作为链接文字，点击跳转到 B 站原页面
            const link = document.getElementById('video-link');
            link.href = `https://www.bilibili.com/video/${video.bvid}`;
            link.textContent = video.title;
        }

        // 页面加载时随机加载一个
        window.addEventListener('DOMContentLoaded', loadVideo);

        // 按钮：换一个
        document.getElementById('next-btn').addEventListener('click', loadVideo);
    </script>
</body>
</html>
